version: 3
name: v3 to v4 fixture - metadata hoist
uses: commands/publish-report
akm:
  schedule: "@daily"
  description: Publishes the nightly report
  when_to_use: Run after the nightly index completes
  tags: [reporting, nightly]
  agent: fixture-agent
  inference:
    temperature: 0.2
  tools: [filesystem]
  timeout: 5m
