name: Single job contract
on:
  workflow_dispatch:
jobs:
  main:
    runs-on: [self-hosted]
    steps:
      - id: prepare
        run: printf single-job-prepared
      - id: review
        uses: akm/command
        with:
          content: Review the single-job execution contract.
      - id: summarize
        run: printf single-job-summarized
