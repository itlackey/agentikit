name: CI

on:
  push:
    branches: [main, "fix/*"]
    paths-ignore:
      - "docs/**"
      - "README.md"
      - "**/CHANGELOG.md"
      - "CLAUDE.md"
      - "LICENSE"
  pull_request:
    branches: [main, "release/*"]
    paths-ignore:
      - "docs/**"
      - "README.md"
      - "**/CHANGELOG.md"
      - "CLAUDE.md"
      - "LICENSE"

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
        # Full history: scripts/lint-golden-captured-at-head.ts resolves recorded
        # `capturedAtHead` commits, and under the default fetch-depth: 1 none of
        # them exist in the clone — the gate then takes its own "inconclusive"
        # branch for EVERY pin and reports OK having judged nothing (#795).
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - run: bun install --frozen-lockfile
      - run: bun run check
      - run: bun run build

  # RUNTIME-01/RUNTIME-02: the ≥1000-case cutover-rekey property gate and the
  # workflow map-expansion boundary test are gated out of the default unit
  # target behind AKM_RUN_SLOW_TESTS (they cost ~4.4 min and ~5s solo
  # respectively — 80% of unit-target work for the property gate alone). Both
  # are deterministic (no flaky host/network dependency, unlike the other
  # opt-in AKM_*_TESTS gates in tests/), so they run on every push/PR here —
  # a dedicated job in parallel with `check` rather than bundled into it, so
  # gating them off the default unit run does not silently retire them and
  # does not lengthen the `check` job's critical path.
  slow-gated-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      - run: bun test --timeout=1200000 tests/migrate/legacy/cutover-rekey-property-gate.test.ts tests/workflows/engine-ir-v3.test.ts
        env:
          AKM_RUN_SLOW_TESTS: "1"

  node-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - run: bun install --frozen-lockfile
      - run: bun run build
      # Installs the SPEC THE PACKAGE DECLARES, read back out of package.json so
      # the two cannot drift — this job exists to prove the binding npm users
      # actually get works. Why it is pinned at all: package.json → pinNotes
      # ["better-sqlite3@12.11.1"] (#790). scripts/node-smoke.ts preflights that
      # what landed is that exact version and that it loads under this node.
      - name: Verify the Node fallback
        run: |
          spec=$(node -p "require('./package.json').optionalDependencies['better-sqlite3']")
          # Remove it first. `npm install pkg@version` is a NO-OP when that exact
          # version is already present and does NOT re-run the install script, so
          # the binding `bun install` built a moment ago — under whichever node
          # its `prebuild-install` saw — would otherwise survive into this job
          # with the wrong ABI. scripts/node-smoke.ts preflights that it loads.
          rm -rf node_modules/better-sqlite3
          npm install --no-save "better-sqlite3@$spec"
          bun run test:node-smoke
          bun run test:node-compat
        env:
          AKM_SMOKE_NODE: node
