name: akm-eval determinism

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

# Replays a recorded improve-smoke run and fails if it did not reproduce.
#
# This used to be a three-step "smoke" job on every push to main/release/fix
# and every PR: a baseline run gated at --fail-below-score 0.75, this replay,
# and a memory-regression suite gated at 0.5. Measured on 2026-09-01, the
# baseline scored a perfect 1.0 — and of the eval's nine case types only
# retrieval (5 cases) and one reflect-quality case actually ran. proposal-
# quality, planner-waste and the rest all SKIPPED, structurally: "no proposal
# traffic in window", "no improve runs under state.db//improve_runs", "only 0
# action(s) across 0 run(s); minActions=50". CI has no LLM and no run history,
# so everything the eval exists to measure was skipped while the job reported
# green. Across 200 runs it caught zero regressions; its only two failures were
# `bun install`.
#
# A green badge implying "output quality was evaluated" when seven of nine case
# types never ran is worse than no badge. Both score gates are gone.
#
# Determinism is the one property here that IS real, cheap, and untested
# elsewhere: the same recorded inputs must replay to the same result. Kept, and
# narrowed to PRs into main.
#
# The harness itself (scripts/akm-eval/) is untouched. Run against a real
# bundle with a real LLM, the skipped case types do execute and it becomes a
# genuine quality signal — it is a dev tool, not a build gate.
on:
  pull_request:
    branches: [main]
    paths:
      - "scripts/akm-eval/**"
      - "src/**"
      - ".github/workflows/akm-eval-smoke.yml"

jobs:
  determinism:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 24

      - run: bun install

      - name: Build akm
        run: |
          bun run build
          chmod +x dist/cli.js

      - name: Seed example-stash index
        env:
          AKM_BUNDLE_DIR: ${{ github.workspace }}/scripts/akm-eval/example-stash
          AKM_DATA_DIR: ${{ runner.temp }}/akm-data
          HOME: ${{ runner.temp }}/akm-home
        run: |
          mkdir -p "$AKM_DATA_DIR" "$HOME"
          ./dist/cli.js index

      - name: Record a run and replay it
        env:
          AKM_BUNDLE_DIR: ${{ github.workspace }}/scripts/akm-eval/example-stash
          AKM_DATA_DIR: ${{ runner.temp }}/akm-data
          HOME: ${{ runner.temp }}/akm-home
        run: |
          scripts/akm-eval/bin/akm-eval-run \
            --suite improve-smoke \
            --stash "$AKM_BUNDLE_DIR" \
            --akm ./dist/cli.js \
            --format none \
            --record
          scripts/akm-eval/bin/akm-eval-replay latest \
            --stash "$AKM_BUNDLE_DIR" \
            --format json \
            > /tmp/replay-summary.json
          jq -e '.deterministic == true' /tmp/replay-summary.json
